name: DSA C++ CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  audit:
    name: Problem Catalog Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Integrity & Quality Audit
        run: |
          python3 scripts/audit_cpp_catalog.py

  build-and-test:
    name: Build & Verify C++20 Programs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++-12
            cxx: g++-12
            sanitizer: 0
          - compiler: clang-14
            cxx: clang++-14
            sanitizer: 0
          - compiler: clang-14-asan
            cxx: clang++-14
            sanitizer: 1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-12 g++-12 clang-14 llvm-14

      - name: Run Test Suite
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          if [ "${{ matrix.sanitizer }}" = "1" ]; then
            # Run AddressSanitizer on basics and sanitized modules
            bash scripts/compile_and_test.sh -j $(nproc) --strict --sanitize 0_basics 13_Trie 15_bit_manipulation
          else
            bash scripts/compile_and_test.sh -j $(nproc) --strict
          fi
